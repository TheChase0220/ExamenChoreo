openapi: "3.0.0"
info:
  title: Greeting Service
  version: 1.0.0
paths:
  /greeter/greet:
    get:
      summary: Greet a person
      description: Greet a person with additional details like age, profession, and country.
      tags:
        - greeting
      parameters:
        - name: name
          in: query
          description: Name of the person to greet
          required: false
          schema:
            type: string
        - name: age
          in: query
          description: Age of the person
          required: false
          schema:
            type: string
        - name: profession
          in: query
          description: Profession of the person
          required: false
          schema:
            type: string
        - name: country
          in: query
          description: Country of the person
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            text/plain:
              schema:
                type: string
      deprecated: false
      security: []
